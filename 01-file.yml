- name: print the msg
  hosts: localhost
  connection: local
  become: true
  tasks:
    - name: print
      debug:
        msg: "Print the message"

    - name: check uptime
      shell: uptime
      register: output

    - name: print uptime
      debug:
        msg: "uptime of server is {{ output.stdout }}"

    - name: Install docker
      dnf:
        name: docker
        state: present

    - name: start docker
      systemd:
        name: docker
        state: restarted
        enabled: yes

    - name: RHEL version
      shell: cat /etc/redhat-release
      register: version

    - name: print rhel
      debug:
        msg: "RHEL version is {{ version.stdout }}"
      when: version.rc == 0

    - name: print date
      shell: date
