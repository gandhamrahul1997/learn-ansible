- name: print the msg
  hosts: localhost
  connection: local
  become: true
  tasks:
    - name: print
      debug:
        msg: "Print the message"

    - name: check uptime
      shell: uptime
      register: output

    - name: print uptime
      debug:
        msg: "uptime of server is {{ output.stdout }}"

    - name: Install nginx
      dnf:
        name: nginx
        state: installed

    - name: start nginx
      systemd:
        name: nginx
        state: restarted
        enabled: yes
